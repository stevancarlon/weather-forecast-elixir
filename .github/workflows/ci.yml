name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "26.2"
          elixir-version: "1.15.8"

      - name: Restore dependencies
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-otp-26-elixir-1.15-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix check
